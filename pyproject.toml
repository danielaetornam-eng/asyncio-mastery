[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncio-mastery"
version = "1.0.0"
description = "Comprehensive asyncio mastery codebase covering 99.99% of asyncio concepts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Asyncio Mastery Team"}]
keywords = ["asyncio", "async", "concurrency", "python", "mastery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/asyncio-mastery/asyncio-mastery"
Repository = "https://github.com/asyncio-mastery/asyncio-mastery"
Issues = "https://github.com/asyncio-mastery/asyncio-mastery/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["asyncio_mastery*"]

[tool.setuptools.package-data]
asyncio_mastery = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TC", "PT", "PTH", "ERA", "PL", "TRY", "SIM", "N", "ARG", "RUF"]
ignore = [
    "S101", "TRY003", "PTH123", "T201", "T203",
    "ANN401",  # any-type - too many in testing and patterns
    "ANN001", "ANN002", "ANN003",  # missing type annotations for args/kwargs
    "ANN201", "ANN202", "ANN204",  # missing return type annotations
    "TRY300",  # try-consider-else - style preference
    "PLR2004",  # magic-value-comparison - style preference
    "PLC0415",  # import-outside-top-level - some dynamic imports needed
    "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",  # unused arguments - common in callbacks
    "RUF006",  # asyncio-dangling-task - false positives in some patterns
    "PLE1142",  # await-outside-async - false positives
    "RUF013",  # implicit-optional - style preference
    "F841",  # unused-variable - some intentional
    "F811",  # redefined-while-unused - some intentional
    "C901",  # complex-structure - some complex functions needed
    "N818",  # error-suffix-on-exception-name - naming convention
    "TRY002",  # raise-vanilla-class - some cases need it
    "E402",  # module-import-not-at-top-of-file - some conditional imports
    "PTH108",  # os-unlink - pathlib alternative not always better
    "PT011",  # pytest-raises-too-broad - test style
    "TRY203",  # useless-try-except - some defensive coding
    "PLR0912",  # too-many-branches - some complex logic
    "PLW0603",  # global-statement - some module-level state needed
    "TRY301",  # raise-within-try - some error handling patterns
    "PLR0915",  # too-many-statements - some complex functions
    "TRY004",  # type-check-without-type-error - some cases
    "RUF012",  # mutable-class-default - some intentional
    "SIM103",  # needless-bool - style preference
    "SIM115",  # open-file-with-context-handler - some cases
    "PLR1704",  # redefined-argument-from-local - some cases
    "PLR0913",  # too-many-arguments - common in complex APIs
    "PLR0917",  # too-many-positional-arguments - common in complex APIs
    "E501",  # line-too-long - some lines exceed 100 chars
    "SIM102",  # collapsible-if - style preference
    "SIM117",  # multiple-with-statements - style preference
    "RUF022",  # unsorted-dunder-all - style preference
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T201", "T203"]
"examples/**" = ["T201", "T203"]
"src/asyncio_mastery/basics/event_loop.py" = ["RUF029"]  # async wrapper without internal await - intentional
"basics/event_loop.py" = ["RUF029"]  # async wrapper without internal await - intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_code_links = true
pretty = true

[[tool.mypy.overrides]]
module = "asyncio_mastery.integrations.database"
disable_error_code = ["import-untyped"]

# timeouts.py intentionally redefines Timeout / timeout_after / run_with_timeout /
# TimeoutManager / demonstrate_timeouts at module level to teach Python's
# name-shadowing semantics (see the "SECOND DEFINITION BLOCK" note inside that
# file). mypy binds names to the FIRST definition, so the later block's sync
# protocol call sites (__enter__/__exit__) are flagged. These errors are the
# anticipated consequence of the deliberate redefinition, so we suppress them
# for this single teaching module.
[[tool.mypy.overrides]]
module = "asyncio_mastery.advanced.timeouts"
disable_error_code = ["no-redef", "attr-defined"]

[tool.coverage.run]
source = ["src/asyncio_mastery"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]